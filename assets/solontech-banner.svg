<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Erico Pinheiro — SolonTech</title>
  <desc id="desc">SolonTech inspired developer banner with a green and yellow hexagonal brand mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020d0a"/>
      <stop offset="0.55" stop-color="#073b2b"/>
      <stop offset="1" stop-color="#0b5d3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="15%" r="75%">
      <stop offset="0" stop-color="#8edb1f" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffd11a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020d0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d8f6d0" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="url(#grid)" stroke="#8edb1f" stroke-opacity="0.22"/>
  <g filter="url(#softGlow)">
    <path d="M108 54L178 94v80l-70 40-70-40V94z" fill="#ffd11a"/>
    <path d="M38 134l70 40 70-40v40l-70 40-70-40z" fill="#0b5d3b"/>
    <path d="M108 54l70 40-70 40-70-40z" fill="#ffcf18" opacity="0.92"/>
    <path d="M74 113c11-18 35-24 55-13l24 14c9 5 9 18 0 23l-29 16c-5 3-6 7-2 11 7 7 19 6 31 0l19-10v18l-12 6c-17 9-40 8-51-3-12-10-12-26 2-34l27-15c3-2 3-5 0-7-9-5-21-2-30 7z" fill="#ffffff"/>
    <path d="M108 67l5 12 13-4-8 11 11 8-14-1-2 14-6-13-13 5 8-12-11-8 14 2z" fill="#ffffff" opacity="0.95"/>
  </g>
  <g fill="#f4fbf1" font-family="Arial, Helvetica, sans-serif">
    <text x="210" y="118" font-size="18" letter-spacing="5" fill="#8edb1f">SOLONTECH / PRODUCT ENGINEERING</text>
    <text x="210" y="171" font-size="44" font-weight="700" letter-spacing="-1">Pedro Erico Pinheiro</text>
    <text x="212" y="207" font-size="19" fill="#d8f6d0">Full-stack systems · payments · applied AI</text>
  </g>
  <g transform="translate(1006 76)">
    <rect width="126" height="34" rx="17" fill="#ffd11a"/>
    <circle cx="19" cy="17" r="5" fill="#102218"/>
    <text x="34" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#102218">BUILD / SHIP</text>
  </g>
  <path d="M210 241H620" stroke="#ffd11a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="210" cy="241" r="5" fill="#8edb1f"/>
  <circle cx="620" cy="241" r="5" fill="#8edb1f"/>
