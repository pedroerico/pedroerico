<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">SolonTech product contribution pulse — September 2026</title>
  <desc id="desc">A snapshot of 180 commits across three SolonTech product repositories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020d0a"/>
      <stop offset="100%" stop-color="#0b5d3b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8edb1f"/>
      <stop offset="100%" stop-color="#ffd11a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="930" cy="42" r="90" fill="#8edb1f" opacity="0.08"/>
  <circle cx="40" cy="280" r="120" fill="#ffd11a" opacity="0.05"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="56" fill="#ffd11a" font-size="13" font-weight="700" letter-spacing="3">PRODUCT ACTIVITY / SEP 2026 SNAPSHOT</text>
    <text x="58" y="92" fill="#ffffff" font-size="25" font-weight="700">Building across the SolonTech ecosystem</text>
    <text x="58" y="119" fill="#c5e4d4" font-size="14">180 product commits · 3 repositories · captured Sep 12, 2026</text>
    <line x1="58" y1="142" x2="942" y2="142" stroke="#8edb1f" stroke-opacity="0.24"/>
    <text x="58" y="172" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1">SOLONPAY CORE</text>
    <text x="942" y="172" fill="#ffd11a" font-size="13" font-weight="700" text-anchor="end">128</text>
    <rect x="58" y="182" width="884" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
    <rect x="58" y="182" width="560" height="10" rx="5" fill="url(#bar)"/>
    <text x="58" y="216" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1">SOLONPAY FRONTEND</text>
    <text x="942" y="216" fill="#ffd11a" font-size="13" font-weight="700" text-anchor="end">38</text>
    <rect x="58" y="226" width="884" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
    <rect x="58" y="226" width="166" height="10" rx="5" fill="url(#bar)"/>
    <text x="58" y="260" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1">SOLONTECH PAGE</text>
    <text x="942" y="260" fill="#ffd11a" font-size="13" font-weight="700" text-anchor="end">14</text>
    <rect x="58" y="270" width="884" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
    <rect x="58" y="270" width="61" height="10" rx="5" fill="url(#bar)"/>
